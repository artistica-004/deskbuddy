<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    background: transparent;
    overflow: hidden;
  }
  #pet {
    width: 450px;
    position: relative;
  }
  canvas {
    width: 100%;
    height: auto;
    display: block;
  }
  video {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="pet">
    <video id="src" src="drink.mp4" autoplay loop muted playsinline></video>
    <canvas id="output"></canvas>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const video = document.getElementById('src');
    const canvas = document.getElementById('output');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    function startDrawing() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      video.play();
      requestAnimationFrame(drawFrame);
    }

    video.addEventListener('loadedmetadata', startDrawing);

    function drawFrame() {
      if (video.paused || video.ended) {
        requestAnimationFrame(drawFrame);
        return;
      }
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = frame.data;

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        if (g > 100 && g > r * 1.3 && g > b * 1.3) {
          data[i + 3] = 0;
        }
      }

      ctx.putImageData(frame, 0, 0);
      requestAnimationFrame(drawFrame);
    }

    // listen for main.js telling us which video to switch to
    ipcRenderer.on('play-task', (event, taskName) => {
      video.src = taskName + '.mp4';
      video.load();
    });
  </script>
</body>
</html>
